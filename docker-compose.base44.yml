services:
  web:
    image: php:8.2-cli
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "3000:3000"
    command: ["php", "-S", "0.0.0.0:3000"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "php -r 'echo @file_get_contents(\"http://localhost:3000/\") !== false ? \"ok\" : exit(1);'"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
